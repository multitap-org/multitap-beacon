<!doctype html>

<!-- The look all piccolo websites share (piccolo-site's assets/README.md):
     a copy next to this page, so the page stands on its own. -->
<link rel="stylesheet" href="_site/v1/site.css">
<style>
  /* This page's own parts; colors, fonts, sites bar and footer are site.css. */
  main.wrap { padding-top: 40px; padding-bottom: 48px; display: grid; gap: 28px; }
  .status-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
  .status-head h1 { margin: 0; }
  .state { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .state::before { content: ""; width: 10px; height: 10px; background: var(--good); }
  .state.down::before { background: var(--accent); }
  .numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
  .number { padding: 18px 20px; display: grid; gap: 4px; }
  .number b {
    font: 600 52px/1 var(--font-heading); color: var(--accent); font-variant-numeric: tabular-nums;
    text-shadow: 3px 3px 0 var(--shadow);
  }
  .number span { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  @media (prefers-color-scheme: light) { .number b { color: var(--text); } }
  /* History charts: one panel per resolution. */
  .charts { display: grid; gap: 24px; }
  .chart { padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  .chart-head .title { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .chart-head .dim { font-size: 13px; color: var(--muted); }
  .chart svg.plot { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .axis { fill: var(--muted); font: 400 11px var(--font-text); }
  .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area { fill: var(--accent); fill-opacity: 0.14; stroke: none; }
  .cross { stroke: var(--muted); stroke-width: 1; shape-rendering: crispEdges; }
  .marker { fill: var(--accent); stroke: var(--band); stroke-width: 2; }
  .tooltip {
    position: absolute; pointer-events: none; display: none; flex-direction: column; gap: 2px;
    background: var(--bg); border: 2px solid var(--edge); padding: 6px 10px; font-size: 13px; white-space: nowrap;
  }
  .tooltip .dim { color: var(--muted); }
  noscript { color: var(--muted); }
</style>
</head>

<main class="wrap">
  <div class="status-head">
    <h1>Beacon status</h1>
    <span class="state" id="updated"></span>
  </div>
  <div class="numbers">
    <div class="panel number"><b id="count">?</b><span id="label">clients online</span></div>
    <div class="panel number"><b id="intros">?</b><span id="intros-label">pairings in the last hour</span></div>
  </div>
  <div class="charts" id="charts"></div>
  <noscript>This page needs JavaScript to read status.json and history.json.</noscript>
</main>
<!-- sites-footer (tools/sync-snippets.sh) -->
<footer class="sites-foot">

  </div>
</footer>
<!-- /sites-footer -->
<script>
"use strict";

const SVG = "http://www.w3.org/2000/svg";

// `text` as a <span> with a color class ("text", "dim"), for the chart heads
// and the tooltip.
function textSpan(text, colorClass) {
  const span = document.createElement("span");
  span.className = colorClass;
  span.textContent = text;
  return span;
}

// `text` into the element with id `id`.
function drawText(id, text) {
  document.getElementById(id).textContent = text;
}

// An axis label inside a chart's SVG, its top at y. `align` is "start",
// "middle" or "end".
function axisText(text, x, y, align) {
  const label = document.createElementNS(SVG, "text");
  label.setAttribute("class", "axis");
  label.setAttribute("x", String(x));
  label.setAttribute("y", String(Math.round(y) + 10));
  label.setAttribute("text-anchor", align);
  label.textContent = text;
  return label;
}

// --- History charts (history.json) -----------------------------------------
// Three resolutions written by beacon: points are [bucket start, most clients
// online in the bucket, pairings in the bucket]. Missing buckets (beacon was
// down) are gaps, not zeros.

const TIERS = [
  { key: "week", title: "last 7 days" },
  { key: "month", title: "last 30 days" },
  { key: "year", title: "last 12 months" },
];
const HISTORY_REFRESH_MS = 300000;
const DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
let lastHistory = null;

function pad2(n) {
  return n < 10 ? "0" + n : String(n);
}

// Tooltip time for a bucket, in the viewer's time zone.
function bucketLabel(key, start) {
  const d = new Date(start * 1000);
  const day = d.getDate() + " " + MONTHS[d.getMonth()];
  if (key === "year") {
    return day + " " + d.getFullYear();
  }
  const time = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  if (key === "week") {
    return DAYS[d.getDay()] + " " + day + " " + time;
  }
  return day + " " + time;
}

// Axis ticks: local midnights (week: every day, month: every 7 days) or the
// first of every month (year), as [unix seconds, label].
function ticks(key, from, to) {
  const out = [];
  const d = new Date(from * 1000);
  d.setHours(0, 0, 0, 0);
  if (key === "year") {
    d.setDate(1);
  }
  while (d.getTime() / 1000 <= to) {
    const t = d.getTime() / 1000;
    if (t >= from) {
      if (key === "week") {
        out.push([t, DAYS[d.getDay()]]);
      } else if (key === "month") {
        out.push([t, d.getDate() + " " + MONTHS[d.getMonth()]]);
      } else {
        out.push([t, MONTHS[d.getMonth()]]);
      }
    }
    if (key === "week") {
      d.setDate(d.getDate() + 1);
    } else if (key === "month") {
      d.setDate(d.getDate() + 7);
    } else {
      d.setMonth(d.getMonth() + 1);
    }
  }
  return out;
}

// A round top for the y axis with 4 steps: 0, 1, 2, 5 x 10^n.
function niceMax(peak) {
  if (peak <= 4) {
    return 4;
  }
  const raw = peak / 4;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = power;
  for (const f of [1, 2, 5, 10]) {
    if (f * power >= raw) {
      step = f * power;
      break;
    }
  }
  return step * 4;
}

// Only well-formed points are used: integers, on a bucket boundary, in order.
function tierPoints(tier) {
  if (tier === null || typeof tier !== "object" || !Number.isInteger(tier.bucket_seconds) ||
      tier.bucket_seconds <= 0 || !Array.isArray(tier.points)) {
    return null;
  }
  const points = [];
  let previous = -1;
  for (const p of tier.points) {
    if (!Array.isArray(p) || p.length !== 3 || !p.every(Number.isInteger) || p[0] <= previous ||
        p[0] % tier.bucket_seconds !== 0 || p[1] < 0 || p[2] < 0) {
      continue;
    }
    points.push(p);
    previous = p[0];
  }
  return { bucket: tier.bucket_seconds, points: points };
}

function drawChart(section, info, data, now) {
  const head = section.querySelector(".chart-head");
  const plotBox = section.querySelector(".plot-box");
  const tooltip = section.querySelector(".tooltip");
  const bucket = data.bucket;
  // The span the tier covers, ending with the bucket in progress.
  const count = info.key === "week" ? 672 : info.key === "month" ? 720 : 366;
  const last = now - (now % bucket);
  const first = last - (count - 1) * bucket;
  const byStart = new Map();
  for (const p of data.points) {
    if (p[0] >= first && p[0] <= last) {
      byStart.set(p[0], p);
    }
  }
  let peak = 0;
  let pairings = 0;
  for (const p of byStart.values()) {
    peak = Math.max(peak, p[1]);
    pairings += p[2];
  }

  // Head: title left, peak and pairings right.
  head.replaceChildren();
  const titleBox = document.createElement("div");
  const sumBox = document.createElement("div");
  head.append(titleBox, sumBox);
  titleBox.appendChild(textSpan(info.title, "title"));
  sumBox.appendChild(textSpan("peak " + peak + " · " + pairings + (pairings === 1 ? " pairing" : " pairings"), "dim"));

  const width = Math.max(300, Math.min(760, Math.round(plotBox.clientWidth || 760)));
  const height = width < 480 ? 150 : 190;
  const left = 44;
  const right = 8;
  const top = 8;
  const bottom = 22;
  const plotW = width - left - right;
  const plotH = height - top - bottom;
  const yMax = niceMax(peak);
  const x = function (t) { return left + ((t - first) / (last - first)) * plotW; };
  const y = function (v) { return top + plotH - (v / yMax) * plotH; };

  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "plot");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", info.title + ": clients online, peak " + peak + ", " + pairings + " pairings");

  // Gridlines and y labels (0 and the top two steps keep it quiet).
  for (let i = 0; i <= 4; i++) {
    const v = (yMax / 4) * i;
    const gy = Math.round(y(v)) + 0.5;
    const line = document.createElementNS(SVG, "line");
    line.setAttribute("class", "grid");
    line.setAttribute("x1", String(left));
    line.setAttribute("x2", String(width - right));
    line.setAttribute("y1", String(gy));
    line.setAttribute("y2", String(gy));
    svg.appendChild(line);
    if (i % 2 === 0) {
      svg.appendChild(axisText(String(v), left - 8, gy - 6, "end"));
    }
  }
  // X ticks.
  const tickList = ticks(info.key, first, last);
  let lastLabelRight = -Infinity;
  for (const [t, label] of tickList) {
    const tx = Math.round(x(t)) + 0.5;
    const line = document.createElementNS(SVG, "line");
    line.setAttribute("class", "grid");
    line.setAttribute("x1", String(tx));
    line.setAttribute("x2", String(tx));
    line.setAttribute("y1", String(top + plotH));
    line.setAttribute("y2", String(top + plotH + 4));
    svg.appendChild(line);
    // Skip labels that would touch the previous one (narrow screens).
    const labelWidth = label.length * 7;
    if (tx - labelWidth / 2 > lastLabelRight + 8 && tx + labelWidth / 2 <= width) {
      svg.appendChild(axisText(label, tx, top + plotH + 7, "middle"));
      lastLabelRight = tx + labelWidth / 2;
    }
  }

  // The series: runs of consecutive buckets, each its own area and line.
  const runs = [];
  let run = [];
  for (let t = first; t <= last; t += bucket) {
    const p = byStart.get(t);
    if (p === undefined) {
      if (run.length > 0) {
        runs.push(run);
      }
      run = [];
    } else {
      run.push(p);
    }
  }
  if (run.length > 0) {
    runs.push(run);
  }
  const baseY = y(0);
  for (const r of runs) {
    let line = "";
    for (let i = 0; i < r.length; i++) {
      line += (i === 0 ? "M" : "L") + x(r[i][0]).toFixed(1) + " " + y(r[i][1]).toFixed(1);
    }
    if (r.length === 1) {
      // A lone bucket is a short flat step, so it's visible.
      line += "L" + (x(r[0][0]) + Math.max(2, plotW / count)).toFixed(1) + " " + y(r[0][1]).toFixed(1);
    }
    const startX = x(r[0][0]).toFixed(1);
    const endX = (r.length === 1 ? x(r[0][0]) + Math.max(2, plotW / count) : x(r[r.length - 1][0])).toFixed(1);
    const area = document.createElementNS(SVG, "path");
    area.setAttribute("class", "area");
    area.setAttribute("d", line + "L" + endX + " " + baseY.toFixed(1) + "L" + startX + " " + baseY.toFixed(1) + "Z");
    svg.appendChild(area);
    const path = document.createElementNS(SVG, "path");
    path.setAttribute("class", "line");
    path.setAttribute("d", line);
    svg.appendChild(path);
  }

  // Hover: a crosshair that snaps to the nearest bucket, a marker on the
  // line, and the values in a tooltip.
  const cross = document.createElementNS(SVG, "line");
  cross.setAttribute("class", "cross");
  cross.setAttribute("y1", String(top));
  cross.setAttribute("y2", String(top + plotH));
  cross.style.display = "none";
  svg.appendChild(cross);
  const marker = document.createElementNS(SVG, "circle");
  marker.setAttribute("class", "marker");
  marker.setAttribute("r", "5");
  marker.style.display = "none";
  svg.appendChild(marker);
  const hit = document.createElementNS(SVG, "rect");
  hit.setAttribute("x", String(left));
  hit.setAttribute("y", "0");
  hit.setAttribute("width", String(plotW));
  hit.setAttribute("height", String(height));
  hit.setAttribute("fill", "transparent");
  svg.appendChild(hit);

  function hide() {
    cross.style.display = "none";
    marker.style.display = "none";
    tooltip.style.display = "none";
  }
  function move(event) {
    const box = svg.getBoundingClientRect();
    const userX = ((event.clientX - box.left) / box.width) * width;
    let index = Math.round(((userX - left) / plotW) * (count - 1));
    index = Math.max(0, Math.min(count - 1, index));
    const t = first + index * bucket;
    const p = byStart.get(t);
    const cx = Math.round(x(t)) + 0.5;
    cross.setAttribute("x1", String(cx));
    cross.setAttribute("x2", String(cx));
    cross.style.display = "";
    const lines = [bucketLabel(info.key, t)];
    if (p === undefined) {
      marker.style.display = "none";
      lines.push(t > now ? "" : "no data");
    } else {
      marker.setAttribute("cx", String(x(t)));
      marker.setAttribute("cy", String(y(p[1])));
      marker.style.display = "";
      lines.push(p[1] + (p[1] === 1 ? " client" : " clients"));
      lines.push(p[2] + (p[2] === 1 ? " pairing" : " pairings"));
    }
    tooltip.replaceChildren();
    for (let i = 0; i < lines.length; i++) {
      if (lines[i] !== "") {
        tooltip.appendChild(textSpan(lines[i], i === 0 ? "dim" : "text"));
      }
    }
    tooltip.style.display = "flex";
    // Beside the crosshair, flipped to the left near the right edge.
    const scale = box.width / width;
    const sectionBox = section.getBoundingClientRect();
    const pxX = box.left - sectionBox.left + cx * scale;
    const tipW = tooltip.offsetWidth;
    let tipX = pxX + 12;
    if (tipX + tipW > sectionBox.width) {
      tipX = pxX - 12 - tipW;
    }
    tooltip.style.left = Math.max(0, tipX) + "px";
    tooltip.style.top = (box.top - sectionBox.top + top * scale) + "px";
  }
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", hide);

  plotBox.replaceChildren(svg);
}

function showHistory() {
  const box = document.getElementById("charts");
  if (lastHistory === null) {
    box.replaceChildren();
    return;
  }
  const now = Math.floor(Date.now() / 1000);
  if (box.children.length !== TIERS.length) {
    box.replaceChildren();
    for (const info of TIERS) {
      const section = document.createElement("section");
      section.className = "panel chart";
      section.dataset.key = info.key;
      const head = document.createElement("div");
      head.className = "chart-head";
      const plotBox = document.createElement("div");
      plotBox.className = "plot-box";
      const tooltip = document.createElement("div");
      tooltip.className = "tooltip";
      section.append(head, plotBox, tooltip);
      box.appendChild(section);
    }
  }
  for (let i = 0; i < TIERS.length; i++) {
    const data = tierPoints(lastHistory[TIERS[i].key]);
    const section = box.children[i];
    section.style.display = data === null ? "none" : "";
    if (data !== null) {
      drawChart(section, TIERS[i], data, now);
    }
  }
}

async function refreshHistory() {
  try {
    const response = await fetch("history.json", { cache: "no-store" });
    if (response.ok) {
      const history = await response.json();
      if (history !== null && typeof history === "object") {
        lastHistory = history;
      }
    }
  } catch (error) {
    // No history (an older beacon, or not written yet): no charts.
  }
  showHistory();
}

let resizeTimer = 0;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(showHistory, 150);
});

// beacon writes status.json every 10 s; older than this, it's not running.
const STALE_SECONDS = 60;
const REFRESH_MS = 30000;
let lastStatus = null;

function show() {
  const now = Date.now() / 1000;
  const fresh = lastStatus !== null && now - lastStatus.updated < STALE_SECONDS;
  if (!fresh) {
    drawText("count", "?");
    drawText("label", "beacon is not answering");
    drawText("intros", "?");
    drawText("updated", lastStatus === null ? "no status yet" : "down · last update " + ago(now - lastStatus.updated));
    document.getElementById("updated").classList.add("down");
    return;
  }
  const hosts = lastStatus.hosts_online;
  drawText("count", String(hosts));
  drawText("label", hosts === 1 ? "client online" : "clients online");
  const intros = lastStatus.introductions_last_hour;
  drawText("intros", String(intros));
  drawText("intros-label", intros === 1 ? "pairing in the last hour" : "pairings in the last hour");
  drawText("updated", "up · updated " + ago(now - lastStatus.updated));
  document.getElementById("updated").classList.remove("down");
}

function ago(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 120) {
    return s + " s ago";
  }
  if (s < 7200) {
    return Math.round(s / 60) + " min ago";
  }
  return Math.round(s / 3600) + " h ago";
}

// Only numbers are taken from the file; anything else counts as no status.
function valid(status) {
  return status !== null && typeof status === "object" &&
         Number.isInteger(status.hosts_online) && status.hosts_online >= 0 &&
         Number.isInteger(status.introductions_last_hour) && status.introductions_last_hour >= 0 &&
         Number.isInteger(status.updated) && status.updated > 0;
}

async function refresh() {
  try {
    const response = await fetch("status.json", { cache: "no-store" });
    if (response.ok) {
      const status = await response.json();
      if (valid(status)) {
        lastStatus = status;
      }
    }
  } catch (error) {
    // Keep the last status: it turns stale on its own.
  }
  show();
}

refresh();
setInterval(refresh, REFRESH_MS);
refreshHistory();
setInterval(refreshHistory, HISTORY_REFRESH_MS);
setInterval(show, 1000);
</script>
</body>
</html>
